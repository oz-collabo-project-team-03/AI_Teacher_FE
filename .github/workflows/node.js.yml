name: suhaengssaem Front Deployment

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - develop

jobs:
  build:
    name: react build & deploy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Github Action
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Generate Environment Variables File for Production
        run: |
          cat << EOF > .env
          VITE_BASE_REQUEST_URL=${{ secrets.VITE_BASE_REQUEST_URL }}
          VITE_KAKAO_CLIENT_ID=${{ secrets.VITE_KAKAO_CLIENT_ID }}
          VITE_KAKAO_CLIENT_SECRET=${{ secrets.VITE_KAKAO_CLIENT_SECRET }}
          VITE_KAKAO_REDIRECT_URI=${{ secrets.VITE_KAKAO_REDIRECT_URI }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_REDIRECT_URI=${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_GOOGLE_SCOPE=${{ secrets.VITE_GOOGLE_SCOPE }}
          VITE_NAVER_CLIENT_ID=${{ secrets.VITE_NAVER_CLIENT_ID }}
          VITE_NAVER_CLIENT_SECRET=${{ secrets.VITE_NAVER_CLIENT_SECRET }}
          VITE_NAVER_REDIRECT_URI=${{ secrets.VITE_NAVER_REDIRECT_URI }}
          EOF

      - name: Install npm dependencies
        run: yarn install

      - name: React build
        run: yarn run build

      - name: Configure ncloud credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region kr-standard
          aws configure set output json

      - name: Upload to bucket
        run: |
          aws --endpoint-url=https://kr.object.ncloudstorage.com s3 sync \
            --delete \
            dist s3://front.suhaengssaem.bucket
